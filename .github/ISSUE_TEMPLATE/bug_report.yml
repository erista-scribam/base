name: Bug report
description: Something broken or regressed in Scribam Prosa
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private manuscript text. Use minimal synthetic examples.
        See [SECURITY.md](../../SECURITY.md) for vulnerabilities (report privately).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pnpm tauri:dev
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: e.g. 0.4.0 or git SHA
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - Web (Vite only)
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Editor mode
      options:
        - Classic
        - Markdown / split
        - Both / unsure
    validations:
      required: false

  - type: checkboxes
    id: verify
    attributes:
      label: Maintainer checks (optional)
      options:
        - label: I ran `pnpm verify` or `pnpm verify:all` when relevant
          required: false
