version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # v2 needs Changesets CLI v3 + new workflow inputs; we use CLI v2 + action v1.
      - dependency-name: "changesets/action"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
